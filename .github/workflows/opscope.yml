name: opscope formula

on:
  pull_request:
    paths: ['Formula/opscope.rb', '.github/workflows/opscope.yml']
  push:
    branches: [main]
    paths: ['Formula/opscope.rb', '.github/workflows/opscope.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install and test the proposed formula
        run: |
          set -euo pipefail
          brew tap stealth-factory/tap
          cp Formula/opscope.rb "$(brew --repo stealth-factory/tap)/Formula/opscope.rb"
          brew install stealth-factory/tap/opscope
          brew test stealth-factory/tap/opscope
          brew style stealth-factory/tap/opscope
          brew audit --strict stealth-factory/tap/opscope
